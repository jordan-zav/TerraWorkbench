name: Internal quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-package:
    name: Tests, Ruff and QGIS ZIP validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality dependencies
        run: python -m pip install numpy packaging pytest ruff scipy

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Validate source metadata
        run: python scripts/package_plugin.py --check-only

      - name: Build and validate QGIS ZIP
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' metadata.txt | head -n 1)"
          test -n "$version"
          python scripts/package_plugin.py --version "$version"
          test -f "dist/TerraWorkbench-$version.zip"

      - name: Ensure validation did not modify tracked files
        run: git diff --exit-code

  qgis-smoke:
    name: Headless QGIS Processing smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install QGIS runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qgis python3-qgis python3-venv

      - name: Create host-compatible scientific environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .qgis-venv
          .qgis-venv/bin/python -m pip install --upgrade pip
          .qgis-venv/bin/python -m pip install -r requirements.txt

      - name: Run TerraWorkbench in headless QGIS
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_PREFIX_PATH: /usr
          PYTHONPATH: /usr/share/qgis/python:/usr/share/qgis/python/plugins
        run: .qgis-venv/bin/python tests/qgis_smoke_test.py
