<text x="40" y="302" font-size="18" font-weight="bold">Scientific Core</text>
<text x="40" y="335" font-size="16">Python kernels</text>
<text x="40" y="358" font-size="16">Optional engines</text>
<text x="40" y="381" font-size="16">No QGIS or Qt</text>
<path d="M320,420 L320,455" stroke="#31556c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="460" width="600" height="150" rx="8" fill="#eef5f8" stroke="#7194a8"/>
<text x="40" y="492" font-size="18" font-weight="bold">Execution</text>
<text x="40" y="525" font-size="16">API, jobs, workflows</text>
